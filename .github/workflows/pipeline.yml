name: Java Practice CI

on:
  push:
    branches: [ "main", "master" ] # This covers you regardless of your branch name
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Compile with Maven
        # This runs the same 'compile' command you did manually in IntelliJ
        run: mvn -B compile --file pom.xml